name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - fmt
          - clippy
          - check
          - test
          - coverage
          - security-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt
        if: matrix.task == 'fmt'
        run: cargo fmt --all -- --check

      - name: Cargo check workspace
        if: matrix.task == 'check'
        run: cargo check --workspace

      - name: Cargo clippy
        if: matrix.task == 'clippy'
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      # Whole-workspace tests — covers every crate (signer / router / bridges /
      # app / core / codec / frostr-utils / profile / devtools), including the
      # NIP-44 KATs (bifrost-signer `nip44_kat`, frostr-utils `nip44_protocol_kat`).
      # Enumerating crates is what rotted the previous matrix; --workspace can't.
      - name: Workspace tests
        if: matrix.task == 'test'
        run: cargo test --workspace

      - name: Install llvm-cov tooling
        if: matrix.task == 'coverage'
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Workspace coverage (llvm-cov)
        if: matrix.task == 'coverage'
        run: |
          mkdir -p artifacts
          cargo llvm-cov --workspace --lcov --output-path artifacts/lcov.info --summary-only
          cargo llvm-cov report --summary-only | tee artifacts/coverage-summary.txt
          bash scripts/evaluate-coverage-targets.sh artifacts/coverage-summary.txt | tee artifacts/coverage-targets.txt

      - name: Upload coverage artifacts
        if: matrix.task == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            artifacts/lcov.info
            artifacts/coverage-summary.txt
            artifacts/coverage-targets.txt

      - name: Install cargo-audit
        if: matrix.task == 'security-audit'
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        if: matrix.task == 'security-audit'
        run: |
          mkdir -p artifacts
          cargo audit 2>&1 | tee artifacts/cargo-audit.txt

      - name: Upload cargo-audit artifact
        if: matrix.task == 'security-audit'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: artifacts/cargo-audit.txt
